<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Output Terminal</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    background-color: #ffffff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }

  .editor-controls {
    max-width: 900px;
    margin: 0 auto 20px auto;
    background: #f4f4f5;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #e4e4e7;
  }

  textarea {
    width: 100%;
    height: 140px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    background-color: #18181b;
    color: #f4f4f5;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #27272a;
    resize: vertical;
  }

  .btn-group {
    margin-top: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  button {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: white;
  }

  .btn-preview { background-color: #16a34a; }
  .btn-pdf { background-color: #dc2626; }
  .btn-img { background-color: #2563eb; }
  button:hover { opacity: 0.9; }

  /* Output Screen Matching Screenshot */
  #capture-area {
    background-color: #ffffff;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  .box {
    background-color: #0d0d0d;
    color: #ffffff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13.5px;
    line-height: 1.35;
    padding: 16px 18px;
    border-radius: 2px;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 180px;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="editor-controls">
  <textarea id="inputText" placeholder="Enter output text here...">Enter employee name: aryan
Enter employee ID: 32
Enter department: IT

--- Employee Information ---
Name            : aryan
Employee ID : 32
Department  : IT
Arjun Paudel
===
Enter name: aryan
Enter age: 32
Enter roll number: 23
Enter marks: 33

--- Student Result ---
Name: aryan
Age: 32
Roll No: 23
Marks: 33
Arjun Paudel
===
Enter student name: aryan
Enter academic marks: 33
Enter sports score: 93

--- Student Information ---
Name            : aryan
Academic Marks  : 33
Sports Score    : 93
Arjun Paudel
===
Area of Rectangle = 50
Area of Circle = 153.938
Area of Triangle = 24
Arjun Paudel
===
Accessing from Derived Class
Public member:10
Protected member:20

Accessing from Main function
Public member:10
Arjun Paudel
===
Public Inheritance:
Public member:10
Protected member :20

Private Inheritance:
Public member :10
Protected member:20

Access from main function:
Public member through PublicDerived:10
Arjun Paudel</textarea>

  <div class="btn-group">
    <button class="btn-preview" onclick="renderGrid()">Update Preview</button>
    <button class="btn-pdf" onclick="exportPDF()">Save PDF</button>
    <button class="btn-img" onclick="exportImage('png')">Save PNG Image</button>
  </div>
</div>

<div id="capture-area">
  <div class="grid-container" id="grid"></div>
</div>

<script>
  function renderGrid() {
    const raw = document.getElementById('inputText').value;
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    // Separate blocks using '===' delimiter
    const items = raw.split(/^===$/m);

    items.forEach(text => {
      const trimmed = text.trim();
      if (trimmed) {
        const box = document.createElement('div');
        box.className = 'box';
        box.textContent = trimmed;
        grid.appendChild(box);
      }
    });
  }

  function exportPDF() {
    const element = document.getElementById('capture-area');
    const opt = {
      margin:       8,
      filename:     'terminal-output.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }

  function exportImage(format) {
    const element = document.getElementById('capture-area');
    html2canvas(element, { scale: 2 }).then(canvas => {
      const a = document.createElement('a');
      a.download = `terminal-output.${format}`;
      a.href = canvas.toDataURL(`image/${format}`);
      a.click();
    });
  }

  // Initial render
  renderGrid();
</script>

</body>
</html>
