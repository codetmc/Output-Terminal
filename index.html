<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  .editor-wrapper {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 20px auto;
    background: #f8f9fa;
    border: 1fr solid #ddd;
    border-radius: 8px;
    padding: 20px;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    color: white;
  }
  .btn-run { background-color: #28a745; }
  .btn-pdf { background-color: #dc3545; }
  .btn-img { background-color: #007bff; }
  .btn:hover { opacity: 0.9; }
  
  .code-input {
    width: 100%;
    height: 160px;
    font-family: 'Courier New', monospace;
    background: #1e1e1e;
    color: #f8f8f2;
    padding: 10px;
    border-radius: 5px;
    box-sizing: border-box;
    font-size: 13px;
    margin-bottom: 15px;
  }

  /* Output Screen Styling */
  #capture-area {
    background: #ffffff;
    padding: 20px;
    border-radius: 6px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 15px;
  }
  .box {
    background-color: #0d0d0d;
    color: #ffffff;
    font-family: 'Courier New', Courier, monospace;
    padding: 12px;
    font-size: 13px;
    line-height: 1.35;
    white-space: pre-wrap;
    border-radius: 4px;
  }
</style>

<!-- External Libraries for Exporting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="editor-wrapper">
  <h3>Interactive Terminal Output Builder</h3>
  <p>Edit the text blocks below (separate each terminal window using <code>---</code>):</p>
  
  <textarea id="rawCode" class="code-input">Enter employee name: aryan
Enter employee ID: 32
Enter department: IT

--- Employee Information ---
Name            : aryan
Employee ID : 32
Department  : IT
Arjun Paudel
---
Enter name: aryan
Enter age: 32
Enter roll number: 23
Enter marks: 33

--- Student Result ---
Name: aryan
Age: 32
Roll No: 23
Marks: 33
Arjun Paudel
---
Area of Rectangle = 50
Area of Circle = 153.938
Area of Triangle = 24
Arjun Paudel</textarea>

  <div class="controls">
    <button class="btn btn-run" onclick="renderBlocks()">Preview Output</button>
    <button class="btn btn-pdf" onclick="exportPDF()">Download PDF</button>
    <button class="btn btn-img" onclick="exportImage('png')">Download PNG</button>
    <button class="btn btn-img" style="background-color: #17a2b8;" onclick="exportImage('jpeg')">Download JPG</button>
  </div>

  <!-- Rendered Container -->
  <div id="capture-area">
    <div id="grid-container" class="grid"></div>
  </div>
</div>

<script>
  function renderBlocks() {
    const rawText = document.getElementById('rawCode').value;
    const container = document.getElementById('grid-container');
    container.innerHTML = '';

    // Split text by '---' to form individual terminal boxes
    const blocks = rawText.split(/^---$/m);

    blocks.forEach(blockText => {
      const trimmed = blockText.trim();
      if (trimmed) {
        const box = document.createElement('div');
        box.className = 'box';
        box.textContent = trimmed;
        container.appendChild(box);
      }
    });
  }

  function exportPDF() {
    const element = document.getElementById('capture-area');
    const opt = {
      margin:       10,
      filename:     'lab-output.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }

  function exportImage(format) {
    const element = document.getElementById('capture-area');
    html2canvas(element, { scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = `lab-output.${format}`;
      link.href = canvas.toDataURL(`image/${format}`);
      link.click();
    });
  }

  // Initial render on load
  renderBlocks();
</script>

</body>
</html>
